name: Deploy to Vercel

on:
  push:
    branches: [main]

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets missing, skipping notification."
            exit 0
          fi

          STATUS="${{ job.status }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          AUTHOR="${{ github.event.head_commit.author.name }}"

          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="Cập nhật nội dung website từ CMS"
          fi

          if [ "$STATUS" = "success" ]; then
            MESSAGE="🚀 *CẬP NHẬT WEBSITE THÀNH CÔNG!*

📝 *Nội dung:* ${COMMIT_MSG}
👤 *Tác giả:* ${AUTHOR:-Admin}
🌐 *Trang chủ:* https://saotruc.vercel.app

✅ *Ghi chú:* Website Sáo trúc Âu Cơ đã tự động xuất bản và cập nhật nội dung mới nhất!"
          else
            MESSAGE="❌ *CẬP NHẬT WEBSITE THẤT BẠI*

📝 *Nội dung:* ${COMMIT_MSG}
👤 *Tác giả:* ${AUTHOR:-Admin}

⚠️ Quá trình tự động xuất bản gặp lỗi. Vui lòng kiểm tra lại."
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" '{chat_id: $chat_id, text: $text, parse_mode: "Markdown"}')"
