name: Deploy to Vercel

on:
  push:
    branches: [main]

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pull Vercel environment
        run: |
          rm -rf .vercel
          npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          node -e "
          const token = process.env.TELEGRAM_BOT_TOKEN;
          const chatId = process.env.TELEGRAM_CHAT_ID;
          if (!token || !chatId) {
            console.log('Telegram secrets missing, skipping notification.');
            process.exit(0);
          }
          const status = process.env.JOB_STATUS;
          const msg = process.env.COMMIT_MSG || 'Cập nhật nội dung website từ CMS';
          const author = process.env.COMMIT_AUTHOR || 'Admin';

          let text = '';
          if (status === 'success') {
            text = \`🚀 *CẬP NHẬT WEBSITE THÀNH CÔNG!*\n\n📝 *Nội dung:* \${msg}\n👤 *Tác giả:* \${author}\n🌐 *Trang chủ:* https://saotruc.vercel.app\n\n✅ *Ghi chú:* Website Sáo trúc Âu Cơ đã tự động xuất bản và cập nhật nội dung mới nhất!\`;
          } else {
            text = \`❌ *CẬP NHẬT WEBSITE THẤT BẠI*\n\n📝 *Nội dung:* \${msg}\n👤 *Tác giả:* \${author}\n\n⚠️ Quá trình tự động xuất bản gặp lỗi. Vui lòng kiểm tra lại.\`;
          }

          fetch(\`https://api.telegram.org/bot\${token}/sendMessage\`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatId, text, parse_mode: 'Markdown' })
          }).then(res => res.json()).then(data => console.log('Telegram notice:', data.ok));
          "
