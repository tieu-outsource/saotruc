order: 3
title: Sáo Recorder
icon: fa-solid fa-leaf
desc: >-
  “Recorder là loại sáo dọc có nguồn gốc châu Âu, phát triển rực rỡ từ thời
  Baroque. Với âm thanh trong sáng, cách chơi dễ tiếp cận và phù hợp cho người
  mới học, recorder hiện được sử dụng phổ biến trong giáo dục âm nhạc tại các
  trường học ở Việt Nam.”
features:
  - Cách thổi kêu và cầm sáo, lấy hơi
  - 'Kỹ thuật thổi cơ bản: Đánh lưỡi đơn'
  - >-
    Bài bản Ngũ Cung đơn giản, giáo trình phương Tây, giáo trình nhạc Ngũ Cung
    Việt Nam
  - 'Phù hợp cho: Trẻ em từ 7 tuổi trở lên'
  - >-
    Recorder Cơ Bản & Nâng Cao Dành cho học sinh, giáo viên Âm nhạc trường phổ
    thông và giáo viên Steiner/Waldorf – phát triển toàn diện kỹ thuật, đọc
    nhạc, hòa tấu và năng lực giảng dạy.
