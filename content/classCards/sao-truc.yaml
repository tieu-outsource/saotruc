order: 1
title: SÁO TRÚC VIỆT NAM
icon: fa-solid fa-music
desc: >-
  Bộ môn chủ đạo của trung tâm. Cây sáo trúc Việt Nam với âm sắc ấm áp, gần gũi,
  phù hợp cho mọi lứa tuổi — từ người mới bắt đầu đến học viên muốn nâng cao.
features:
  - Cách đặt môi, cầm sáo, tư thế thổi sáo và lấy hơi
  - Luyện hơi, kỹ thuật môi, ngón, đánh lưỡi
  - 'Thực hành trên các thể loại: Dân Ca, Nhạc trữ tình, Nhạc trẻ,...'
  - Giáo trình linh hoạt theo khả năng của học viên
  - Dạy các bài Học Viên yêu thích khi đã vững kỹ thuật
