order: 1
title: SÁO TRÚC
icon: fa-solid fa-music
desc: >-
  Bộ môn chủ đạo của trung tâm. Cây sáo trúc Việt Nam với âm sắc ấm áp, gần gũi,
  phù hợp cho mọi lứa tuổi — từ người mới bắt đầu đến học viên muốn nâng cao.
features:
  - Cách cầm sáo, tư thế thổi và hơi thở cơ bản
  - Luyện ngón, tiết tấu và cảm âm
  - Bài bản dân ca, nhạc trữ tình, nhạc phim
  - Giáo trình bài bản, dễ hiểu theo từng giai đoạn
