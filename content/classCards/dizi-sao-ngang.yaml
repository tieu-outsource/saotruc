order: 2
title: Sáo Dizi - Trung Quốc
icon: fa-solid fa-wind
desc: >-
  Sáo trúc ngang truyền thống Trung Hoa, âm vực rộng với kỹ thuật phong phú —
  dành cho học viên muốn mở rộng vốn kỹ thuật và màu sắc âm thanh.
features:
  - Cách đặt môi, cầm sáo Dizi & dán màng rung
  - 'Thực hành: các ca khúc Nhạc Hoa kết hợp các ngón đặc trưng của Dizi'
  - 'Kỹ thuật: Hơi, Lưỡi, Ngón và cách ứng dụng vào các thế tay cơ bản'
  - Lộ trình từ cơ bản đến nâng cao
