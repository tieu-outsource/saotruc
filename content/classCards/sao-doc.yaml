order: 7
title: Sáo Dọc
icon: fa-solid fa-music
desc: >-
  Sáo dọc với thế bấm tương tự như sáo ngang nhưng có huyệt thổi ngậm, phù hợp
  cho trẻ em và người lớn tuổi. Nhất là những người gặp khó khăn trong quá trình
  tập "Sáo ngang" có thể lựa chọn "Sáo dọc" để bắt đầu làm quen và tập luyện.
features:
  - Âm sắc khác Sáo ngang một chút, kêu nhỏ hơn Sáo ngang
  - 'Ưu điểm: dễ thổi, dễ học, tiếng kêu bé nên tập luyện ít ảnh hưởng'
